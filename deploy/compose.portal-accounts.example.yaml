# Applied automatically by Make when music.env exists; preserves host overrides.
services:
  app:
    volumes:
      - music-identity:/run/music-identity:ro
    environment:
      NAVIDROME_AUTOLOGIN_ENABLED: "${NAVIDROME_AUTOLOGIN_ENABLED:-true}"
      NAVIDROME_SESSION_BRIDGE_ENABLED: "${NAVIDROME_SESSION_BRIDGE_ENABLED:-true}"
    networks: [internal, accounts]
  web:
    networks:
      internal: {}
      accounts:
        aliases: [multisuite-portal-web]
  composer:
    networks: [internal, devtools, accounts]
  scheduler:
    # Always active in integrated mode without overriding COMPOSE_PROFILES.
    profiles: !reset []
    networks: [internal, accounts]
networks:
  accounts:
    external: true
    name: multisuite-accounts

volumes:
  music-identity:
    external: true
    name: multisuite-music-identity
