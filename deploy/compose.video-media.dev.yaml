# Development only, applied by Make with video.env and the development NAS: Jellyfin reads each
# person's connected «Vídeos» folder and what is published for everyone (MediaLibrary,
# CommonLibrary) from /personal, and the development common folder from /common. Read-only.
services:
  jellyfin:
    volumes:
      - type: volume
        source: nas
        target: /personal
        read_only: true
        volume:
          subpath: .multisuite-media/video
      - type: volume
        source: nas
        target: /common
        read_only: true
        volume:
          subpath: .multisuite-video-common
volumes:
  nas:
    external: true
    name: multisuite-nas-dev
