# Use alongside compose.reading.yaml, never as the only Compose file. Joins the network the
# portal uses to manage accounts; Kavita is reached there as http://kavita:5000.
services:
  kavita:
    ports: !reset []
    networks:
      default: {}
      accounts:
        aliases: [kavita]
  reading-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    networks: [default, accounts]
    depends_on: [kavita]
    ports:
      - "127.0.0.1:${KAVITA_PORT:-5000}:8080"
    volumes:
      - ./docker/reading-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/reading-proxy/enter.js:/usr/share/nginx/html/enter.js:ro
      - ./docker/music-proxy/public:/usr/share/nginx/html:ro
    security_opt: [no-new-privileges:true]
    user: "101:101"
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /var/cache/nginx:uid=101,gid=101
      - /var/run:uid=101,gid=101
    entrypoint: ["nginx", "-g", "daemon off;"]
networks:
  default: {}
  accounts:
    external: true
    name: multisuite-accounts
