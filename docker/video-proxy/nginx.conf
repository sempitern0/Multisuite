# Vídeo gateway (docs/JELLYFIN.md): the only published entry to Jellyfin. It proxies the web
# interface, API, WebSocket and streams unchanged and adds two files to the web shell only: the
# Multisuite look (video.css) and the «Volver a Multisuite» link (video.mjs). Apps use the API.
map $http_upgrade $video_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 0;

    # Back to the portal: answered by the portal itself, never an arbitrary redirect.
    location = /_multisuite/portal {
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/music/portal;
        proxy_pass_request_headers off;
        proxy_redirect off;
    }
    # Opening from the portal: the ticket goes to the portal, which answers with a page on this
    # origin (enter.js) holding the person's own Jellyfin session. POST only, small body.
    location = /_multisuite/launch {
        limit_except POST { deny all; }
        client_max_body_size 2k;
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/video/session;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_redirect off;
    }
    location = /_multisuite/enter.js {
        alias /usr/share/nginx/html/enter.js;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /_multisuite/video.mjs {
        alias /usr/share/nginx/html/video.mjs;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /_multisuite/video.css {
        alias /usr/share/nginx/html/video.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }
    location /_multisuite/ { return 404; }

    location / {
        set $jellyfin http://jellyfin:8096;
        proxy_pass $jellyfin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $video_connection;
        # Uncompressed HTML so the shell can be extended; media and API stay untouched.
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        # sub_filter only rewrites text/html: the web shell, never streams or JSON.
        sub_filter '</head>' '<link rel="stylesheet" href="/_multisuite/video.css"><script type="module" src="/_multisuite/video.mjs"></script></head>';
    }
}
