# Entry to MeTube (docs/DOWNLOADS.md). MeTube has no accounts: this gateway lets a request through
# only when the portal confirms, on every request, that its cookie belongs to an active owner or
# administrator. The cookie is set by the portal's answer to /_multisuite/launch (single-use
# ticket from «Descargas» in the portal), on this gateway's own origin.
map $http_upgrade $metube_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 1m;
    # Redirects stay relative: the published port differs from the one nginx listens on.
    absolute_redirect off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location = /_multisuite/health { access_log off; return 204; }

    location = /_multisuite/launch {
        limit_except POST { deny all; }
        client_max_body_size 2k;
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/downloads/session;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_redirect off;
    }

    # Without a valid session: back to the portal, which opens Descargas again or explains why not.
    location = /_multisuite/portal {
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/downloads/portal;
        proxy_pass_request_headers off;
        proxy_redirect off;
    }

    location = /_multisuite/auth {
        internal;
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/downloads/check;
        proxy_pass_request_body off;
        proxy_pass_request_headers off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Multisuite-Downloads $cookie_multisuite_downloads;
    }

    location /_multisuite/ { return 404; }

    location @portal { return 302 /_multisuite/portal; }

    location / {
        auth_request /_multisuite/auth;
        error_page 401 403 = @portal;
        set $metube http://metube:8081;
        proxy_pass $metube;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $metube_connection;
        # Never forward the portal's session cookie to MeTube.
        proxy_set_header Cookie "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
