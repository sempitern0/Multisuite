map $http_upgrade $reading_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 0;
    location = /_multisuite/launch {
        limit_except POST { deny all; }
        client_max_body_size 2k;
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/reading/session;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Access-Control-Allow-Origin;
    }
    location = /_multisuite/enter.js {
        alias /usr/share/nginx/html/enter.js;
        default_type application/javascript;
    }
    location = /_multisuite/portal {
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/music/portal;
        proxy_pass_request_headers off;
        proxy_redirect off;
    }
    location = /_multisuite/return.js {
        alias /usr/share/nginx/html/return.js;
        default_type application/javascript;
    }
    location / {
        set $reading http://kavita:5000;
        proxy_pass $reading;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $reading_connection;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        sub_filter '<app-root' '<script defer src="/_multisuite/return.js"></script><app-root';
    }
}
