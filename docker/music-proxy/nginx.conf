worker_processes auto;
pid /tmp/nginx.pid;
# Request URLs may contain Subsonic credentials: never log them.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/music-private/*.conf;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    map $http_sec_fetch_site $foreign_request {
        default 0;
        cross-site 1;
        same-site 1;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        location = /_multisuite/portal {
            set $portal http://multisuite-portal-web:80;
            proxy_pass $portal/api/music/portal;
            proxy_pass_request_headers off;
            proxy_redirect off;
        }
        location = /_multisuite/logout {
            add_header Set-Cookie "ms_music=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict" always;
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'" always;
            try_files /session.html =404;
        }
        location = /_multisuite/manual {
            if ($request_method != POST) { return 405; }
            add_header Set-Cookie "ms_music=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict" always;
            add_header Set-Cookie "jwt=; Path=/; Max-Age=0; HttpOnly; SameSite=Strict" always;
            add_header Set-Cookie "ms_music_browser=; Path=/_multisuite/verify; Max-Age=0; HttpOnly; SameSite=Strict" always;
            add_header Cache-Control no-store always;
            return 204;
        }
        location = /_multisuite/native-ready {
            if ($cookie_ms_music != "") { return 409; }
            if ($cookie_jwt != "") { return 409; }
            return 204;
        }
        location = /_multisuite/health { return 204; }
        location = /_multisuite/session { try_files /session.html =404; }
        location = /_multisuite/session.mjs { try_files /session.mjs =404; }
        location = /_multisuite/session.css { try_files /session.css =404; }
        location = /_multisuite/verify {
            limit_except POST { deny all; }
            client_max_body_size 8k;
            set $portal http://multisuite-portal-web:80;
            proxy_pass $portal/api/music/session/verify;
            proxy_set_header X-Music-Browser $cookie_ms_music_browser;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header Remote-User "";
            # Laravel sets only the host-scoped music grant on this stateless route.
            proxy_pass_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        # Used by auth_request and by the launcher before opening Navidrome.
        location = /_multisuite/authorize {
            limit_except GET { deny all; }
            set $portal http://multisuite-portal-web:80;
            proxy_pass $portal/api/music/session/authorize;
            proxy_method GET;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Music-Grant $cookie_ms_music;
            proxy_set_header X-Music-Origin $http_origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location @portal_music {
            if ($foreign_request) { return 403; }
            # Navidrome accepts native JWTs from query parameters ahead of ExtAuth.
            if ($args ~* "(^|&)(jwt|[^=&]*%[^=&]*)=") { return 403; }
            auth_request /_multisuite/authorize;
            auth_request_set $verified_user $upstream_http_x_music_user;
            set $trusted_music http://navidrome-sso:4533;
            proxy_pass $trusted_music;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-ND-Authorization "";
            proxy_set_header X-Multisuite-Music-User $verified_user;
            proxy_hide_header Access-Control-Allow-Origin;
            add_header Cache-Control "private, no-store" always;
            add_header Referrer-Policy no-referrer always;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }

        location /_multisuite/ { return 404; }

        location / {
            error_page 418 = @portal_music;
            if ($cookie_ms_music != "") { return 418; }
            proxy_set_header X-Multisuite-Music-User "";
            # Do not apply the bridge's CSP to the upstream application's UI.
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            set $music http://navidrome:4533;
            proxy_pass $music;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # No external-auth headers are trusted by this gateway.
            proxy_set_header Remote-User "";
            proxy_set_header X-Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Webauth-User "";
            proxy_set_header X-Auth-Request-User "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
