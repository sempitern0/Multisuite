worker_processes auto;
pid /tmp/nginx.pid;
# Request URLs may contain Subsonic credentials: never log them.
error_log /dev/stderr crit;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    types { application/javascript mjs; }
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;

        location = /_multisuite/health { return 204; }
        location = /_multisuite/session { try_files /session.html =404; }
        location = /_multisuite/session.mjs { try_files /session.mjs =404; }
        location = /_multisuite/session.css { try_files /session.css =404; }
        location = /_multisuite/verify {
            limit_except POST { deny all; }
            client_max_body_size 8k;
            set $portal http://multisuite-portal-web:80;
            proxy_pass $portal/api/music/session/verify;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header Remote-User "";
            proxy_hide_header Set-Cookie;
            proxy_hide_header Access-Control-Allow-Origin;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }
        location /_multisuite/ { return 404; }

        location / {
            # Do not apply the bridge's CSP to the upstream application's UI.
            add_header X-Content-Type-Options nosniff always;
            add_header Referrer-Policy no-referrer always;
            set $music http://navidrome:4533;
            proxy_pass $music;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            # No external-auth headers are trusted by this gateway.
            proxy_set_header Remote-User "";
            proxy_set_header X-Remote-User "";
            proxy_set_header X-Forwarded-User "";
            proxy_set_header X-Webauth-User "";
            proxy_set_header X-Auth-Request-User "";
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 300s;
        }
    }
}
