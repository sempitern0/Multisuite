# Only the portal and the gateway mount this socket. Never publish an HTTP listener here.
server {
    listen unix:/run/music-identity/lookup.sock;
    location ~ "^(/[a-zA-Z0-9._~-]+)*/api/user/[0-9a-fA-F-]{36}$" {
        limit_except GET { deny all; }
        set $backend http://navidrome-sso:4533;
        proxy_pass $backend$uri;
        proxy_method GET;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Multisuite-Music-User $http_x_music_listener;
        proxy_connect_timeout 2s;
        proxy_read_timeout 4s;
    }
    location / { return 404; }
}
