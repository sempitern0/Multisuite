map $http_upgrade $komga_connection {
    default upgrade;
    '' close;
}
server {
    listen 8080;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 0;

    location = /_multisuite/portal {
        set $portal http://multisuite-portal-web:80;
        proxy_pass $portal/api/music/portal;
        proxy_pass_request_headers off;
        proxy_redirect off;
    }
    location = /_multisuite/reading.mjs {
        alias /usr/share/nginx/html/reading.mjs;
        default_type application/javascript;
        add_header Cache-Control "no-cache";
    }
    location = /_multisuite/reading.css {
        alias /usr/share/nginx/html/reading.css;
        default_type text/css;
        add_header Cache-Control "no-cache";
    }
    location = /_multisuite/auth {
        internal;
        set $komga http://komga:25600;
        proxy_pass $komga/api/v1/users/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }
    location = /_multisuite/revision {
        auth_request /_multisuite/auth;
        alias /srv/media/.multisuite-revision;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
    }
    location /_multisuite/ { return 404; }

    location / {
        set $komga http://komga:25600;
        proxy_pass $komga;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $komga_connection;
        proxy_set_header Accept-Encoding "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        # Match only the application shell, never the EPUB HTML documents.
        sub_filter '<div id="app">' '<link rel="stylesheet" href="/_multisuite/reading.css"><script type="module" src="/_multisuite/reading.mjs"></script><div id="app">';
        sub_filter '<div id=app>' '<link rel="stylesheet" href="/_multisuite/reading.css"><script type="module" src="/_multisuite/reading.mjs"></script><div id=app>';
    }
}
