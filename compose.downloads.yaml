# Descargas (P04.3, docs/DOWNLOADS.md). Standalone stack: do NOT merge with Laravel's compose.yaml.
# MeTube (maintained web interface for yt-dlp) downloads into a staging volume shared with the
# portal; only owner and administrators reach it, through downloads-gateway, which asks the portal
# on every request. Nothing reaches Mis archivos until someone saves it there from the portal
# (quota, type checks and encryption of a normal upload). MeTube has no accounts of its own.
name: ${DOWNLOADS_PROJECT_NAME:-multisuite-downloads}
services:
  metube:
    image: ${METUBE_IMAGE:-ghcr.io/alexta69/metube:2026.11.24}
    restart: unless-stopped
    environment:
      PUID: "${DOWNLOADS_UID:-1000}"
      PGID: "${DOWNLOADS_GID:-1000}"
      DOWNLOAD_DIR: /downloads
      # Partial files and MeTube's own state stay out of the folder the portal lists.
      TEMP_DIR: /state/tmp
      STATE_DIR: /state
      DOWNLOAD_DIRS_INDEXABLE: "false"
      # Per-download yt-dlp options would allow running commands in the container.
      ALLOW_YTDL_OPTIONS_OVERRIDES: "false"
      YTDL_OPTIONS: '{"max_filesize": ${DOWNLOADS_MAX_FILE_BYTES:-21474836480}, "restrictfilenames": true}'
      TZ: Europe/Madrid
    # Not published and not on the accounts network: only the gateway reaches it.
    networks: [default]
    volumes:
      - downloads-staging:/downloads
      - metube-state:/state
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  downloads-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${DOWNLOADS_PORT:-8084}:8080"
    depends_on: [metube]
    networks: [default, accounts]
    volumes:
      - ./docker/downloads-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/_multisuite/health"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  accounts:
    external: true
    name: ${DOWNLOADS_ACCOUNTS_NETWORK:-multisuite-accounts}
volumes:
  # Shared with the portal (deploy/compose.portal-downloads.example.yaml), created by Make.
  downloads-staging:
    external: true
    name: ${DOWNLOADS_STAGING_VOLUME:-multisuite-downloads}
  metube-state:
