# Red privada (docs/VPN.md). Standalone and optional: only `make vpn-up` with a vpn.env starts it;
# `make up` and local development never depend on it. Do NOT merge with Laravel's compose.yaml.
#
# - headscale: coordination server (the only part that may be public: login and keys, no content).
# - vpn-node: the NAS as a device of the private network (userspace mode: no /dev/net/tun, also on
#   Docker Desktop). Joins with `make vpn-join`; its address is published as the private names.
# - vpn-entry: Traefik inside vpn-node's network namespace. It only answers on the private network
#   and forwards each private name to the portal or a service gateway on the accounts network.
#   HTTPS for those names comes from deploy/compose.vpn-tls.yaml (VPN_TLS=acme-dns).
# The portal never receives this stack's socket, keys or devices.
name: ${VPN_PROJECT_NAME:-multisuite-vpn}
x-hosts: &hosts
  VPN_PORTAL_HOST: ${VPN_PORTAL_HOST:-multisuite.multisuite.internal}
  VPN_MUSIC_HOST: ${VPN_MUSIC_HOST:-}
  VPN_READING_HOST: ${VPN_READING_HOST:-}
  VPN_VIDEO_HOST: ${VPN_VIDEO_HOST:-}
services:
  # Headscale refuses to start without its records file: create an empty list once.
  vpn-dns-init:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.7}
    entrypoint: ["sh", "-c", "[ -s /dns/extra-records.json ] || echo '[]' > /dns/extra-records.json"]
    network_mode: none
    volumes:
      - vpn-dns:/dns
  headscale:
    image: ${HEADSCALE_IMAGE:-headscale/headscale:0.29.8}
    command: serve
    restart: unless-stopped
    read_only: true
    tmpfs: [/var/run/headscale]
    environment:
      # Address the devices use (also printed in their login page). No trailing slash.
      HEADSCALE_SERVER_URL: ${VPN_SERVER_URL:-http://127.0.0.1:8090}
      HEADSCALE_LISTEN_ADDR: 0.0.0.0:${VPN_LISTEN_PORT:-8080}
      # Public server: certificate from Let's Encrypt for the control name (HTTP-01 on port 80).
      HEADSCALE_TLS_LETSENCRYPT_HOSTNAME: ${VPN_CONTROL_DOMAIN:-}
      HEADSCALE_ACME_EMAIL: ${VPN_ACME_EMAIL:-}
      HEADSCALE_DNS_BASE_DOMAIN: ${VPN_MAGIC_DOMAIN:-red.multisuite.internal}
    ports:
      - "${VPN_BIND_IP:-127.0.0.1}:${VPN_CONTROL_PORT:-8090}:${VPN_LISTEN_PORT:-8080}"
      - "${VPN_BIND_IP:-127.0.0.1}:${VPN_ACME_PORT:-8089}:80"
    volumes:
      - ./docker/headscale/config.yaml:/etc/headscale/config.yaml:ro
      - ./docker/headscale/policy.hujson:/etc/headscale/policy.hujson:ro
      - headscale-data:/var/lib/headscale
      - vpn-dns:/etc/headscale/dns:ro
    depends_on:
      vpn-dns-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "headscale", "health"]
      interval: 15s
      timeout: 5s
      retries: 8
    networks:
      vpn:
        # The NAS reaches its own control server by its public name without leaving the host
        # (no hairpin NAT), and the certificate still matches.
        aliases: ["${VPN_CONTROL_DOMAIN:-headscale.vpn.internal}"]
  vpn-node:
    image: ${TAILSCALE_IMAGE:-tailscale/tailscale:v1.104.7}
    entrypoint: ["sh", "/opt/multisuite/node.sh"]
    restart: unless-stopped
    hostname: multisuite
    environment:
      <<: *hosts
      VPN_CONTROL_DOMAIN: ${VPN_CONTROL_DOMAIN:-}
      VPN_LISTEN_PORT: ${VPN_LISTEN_PORT:-8080}
    volumes:
      - ./docker/vpn-node/node.sh:/opt/multisuite/node.sh:ro
      - vpn-node-state:/var/lib/tailscale
      - vpn-dns:/dns
    depends_on:
      headscale: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "tailscale", "status", "--peers=false"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks: [vpn, accounts]
  vpn-entry:
    image: ${TRAEFIK_IMAGE:-traefik:v3.8.0}
    restart: unless-stopped
    network_mode: service:vpn-node
    environment:
      <<: *hosts
    command:
      - --entrypoints.web.address=:80
      - --entrypoints.ping.address=:8082
      - --ping.entrypoint=ping
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=true
      - --api.dashboard=false
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --log.level=WARN
    volumes:
      - ./docker/vpn-entry/http.yml:/etc/traefik/dynamic/routes.yml:ro
    depends_on: [vpn-node]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8082/ping"]
      interval: 30s
      timeout: 5s
      retries: 3
networks:
  vpn:
  accounts:
    external: true
    name: ${VPN_ACCOUNTS_NETWORK:-multisuite-accounts}
volumes:
  headscale-data:
  vpn-node-state:
  vpn-dns:
