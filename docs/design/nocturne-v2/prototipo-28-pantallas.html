 case 23:return wrap('Avisos del sistema','Comprueba si algún servicio necesita atención.',`<div class="grid cols-3"><div class="panel stat"><div class="cap">Importantes</div><div class="value">0</div><div class="trend">Todo en orden</div></div><div class="panel stat"><div class="cap">Por revisar</div><div class="value">1</div></div><div class="panel stat"><div class="cap">Informativos</div><div class="value">3</div></div></div><div class="subhead"><h2>Lo más reciente</h2></div><div class="panel panelpad">${row('<div><strong>Documentos en mantenimiento</strong><div class="meta">El servicio volverá pronto</div></div>',B('Ver detalle',10,'ghost',true))}${row('<div><strong>Música disponible</strong><div class="meta">Se puede usar con normalidad</div></div>',tag('Bien'))}</div>`,'','ADMINISTRACIÓN');
 case 24:return wrap('Confirmaciones','Estos mensajes aparecen cuando una acción necesita tu decisión.',`<div class="panel panelpad"><h2>Elige una acción</h2><div class="displaygallery">${M('Guardar cambios','confirm')}${M('Eliminar','danger','danger')}${M('Quitar acceso','revoke')}${M('Cambiar contraseña','password')}${M('Códigos de recuperación','recovery')}</div></div>`,'','EJEMPLOS');
 case 25:return wrap('Mensajes','Así se muestran los avisos breves.',`<div class="panel panelpad"><div class="displaygallery">${T('Guardado','Cambios guardados.','primary')}${T('Aviso','Hay novedades en tu espacio.')}${T('Atención','El servicio tarda en responder.')}${T('Error','No hemos podido completar la acción.')}</div></div>`,'','EJEMPLOS');
 }
 return '';
}
function navButton(page,label,iconName){return `<button type="button" class="navbtn ${(current===page||((current>=7&&current<=11)&&page===6))?'active':''}" data-go="${page}" aria-current="${current===page?'page':'false'}"><span class="navico">${I(iconName)}</span><span class="navtext">${label}</span>${page===15?'<span class="navright">3</span>':''}</button>`}
function sidebar(){
 return `<aside class="sidebar" id="sidebar"><div class="brand"><div class="brandmark">◈</div><div><div class="brandtext">multisuite.</div><div class="brandsub">NOCTURNE</div></div></div><div class="sidebar-main"><div class="group-title">Inicio</div>${navButton(6,'Servicios','grid')}${role==='admin'?navButton(5,'Resumen','chart'):''}${role==='admin'?`<div class="group-title">Administración</div>${navButton(17,'Personas','users')}${navButton(18,'Invitaciones','mail')}${navButton(21,'Accesos','shield')}${navButton(23,'Avisos del sistema','alert')}${navButton(22,'Ajustes generales','settings')}`:''}<div class="group-title">Tu actividad</div>${navButton(15,'Notificaciones','bell')}${navButton(16,'Actividad','history')}</div><div class="sidebottom"><div class="group-title">Mi cuenta</div>${navButton(12,'Mi perfil','user')}${navButton(14,'Seguridad','lock')}${navButton(13,'Preferencias','settings')}<div class="person"><span class="avatar">${role==='admin'?'AG':'LM'}</span><div><strong class="slim">${role==='admin'?'Alex García':'Lucía Martín'}</strong><div class="small">${role==='admin'?'Administrador':'Usuario'}</div></div></div>${navButton(1,'Cerrar sesión','logout')}</div></aside>`
}
function updateScreenSelect(){
 const select=document.getElementById('screenSelect');select.innerHTML=screens.map((s,i)=>`<option value="${i}" ${role!=='admin'&&ADMIN.has(i)?'disabled':''}>${String(i+1).padStart(2,'0')} · ${s[0]}</option>`).join('');
 select.value=String(current);document.getElementById('counter').textContent=`${String(current+1).padStart(2,'0')} / ${screens.length}`;
}
function render(){
 fid=0;const app=document.getElementById('app');
 app.innerHTML=AUTH.has(current)?`<main class="main">${auth()}</main>`:`<div class="shell">${sidebar()}<div class="mobile-shade" data-close-nav></div><main class="main"><div class="topbar"><button class="iconbtn menubtn" type="button" data-nav="toggle" aria-label="Abrir menú">${I('menu')}</button><div class="breadcrumbs">Multisuite <span style="padding:0 9px;color:#627363">/</span><strong>${screens[current][0]}</strong></div><div class="top-spacer"></div><button class="iconbtn" type="button" aria-label="Notificaciones" data-go="15">${I('bell')}</button><button class="iconbtn" type="button" aria-label="Mi perfil" data-go="12">${I('user')}</button></div><div class="content">${page()}</div></main></div>`;
 updateScreenSelect();
}
function go(i){
 let next=Number(i);if(!Number.isInteger(next)||next<0||next>=screens.length)next=6;
 if(role!=='admin'&&ADMIN.has(next)){next=6;toast('Esta sección es solo para administradores.');}
 current=next;document.body.classList.remove('nav-open');closeModal();render();window.scrollTo({top:0,behavior:'instant'});
}
function switchRole(next){role=next==='admin'?'admin':'member';document.getElementById('roleSelect').value=role;go(role==='admin'?5:6)}
function toast(message,type=''){const id=++toastsId;const el=document.createElement('div');el.className=`toast ${type==='error'?'red':type==='warn'?'amber':''}`;el.dataset.tid=id;el.innerHTML=`<span style="color:var(--yellow)">${I(type==='error'?'alert':'check',19)}</span><span>${esc(message)}</span><button type="button" aria-label="Cerrar aviso" style="margin-left:auto;background:none;border:0;color:#a2b09f" data-dismiss="${id}">×</button>`;document.getElementById('toasts').appendChild(el);setTimeout(()=>el.remove(),4800)}
function modal(type){
 const types={confirm:['¿Guardar cambios?','Se guardarán los cambios que has hecho.','Guardar','primary'],danger:['¿Eliminar este elemento?','No podrás recuperarlo después.','Eliminar','danger'],revoke:['¿Quitar este acceso?','Este dispositivo o persona dejará de tener acceso.','Quitar acceso','danger'],password:['Cambiar contraseña','Primero confirma que eres tú.','Continuar','primary'],recovery:['Códigos de recuperación','Guarda tus códigos en un lugar seguro.','Entendido','primary'],user:['Datos de la persona','Revisa sus servicios y permisos.','Ver accesos','primary']};
 const [title,desc,confirm,kind]=types[type]||types.confirm;activeModal=type;lastFocus=document.activeElement;
 document.getElementById('overlay').innerHTML=`<div class="modalshade" role="presentation"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="icon">${I('info',28)}</div><h2 id="modalTitle">${title}</h2><p class="muted">${desc}</p><div class="actions" style="justify-content:flex-end;margin-top:25px"><button type="button" class="btn btn-ghost" data-close="1">Cancelar</button><button type="button" class="btn btn-${kind}" data-confirm="1">${confirm}</button></div></div></div>`;
 document.querySelector('[data-close]').focus();
}
function closeModal(){if(!activeModal)return;activeModal=null;document.getElementById('overlay').innerHTML='';lastFocus?.focus?.()}
function onSubmit(e){const form=e.target.closest('form[data-flow]');if(!form)return;e.preventDefault();const kind=form.dataset.flow;
 if(kind==='invite'||kind==='reset'){
   const passes=[...form.querySelectorAll('input[type="password"]')];if(passes.length>1&&passes[0].value!==passes[1].value){toast('Las contraseñas no coinciden.','error');passes[1].focus();return;}
 }
 if(kind==='login'||kind==='invite'){go(4)}
 else if(kind==='verify'){go(role==='admin'?5:6)}
 else if(kind==='recover'){toast('Te hemos enviado un enlace para cambiar la contraseña.');}
 else if(kind==='confirm'){go(14);toast('Contraseña confirmada.');}
 else if(kind==='reset'){go(1);toast('Ya puedes entrar con tu nueva contraseña.');}
}
document.getElementById('screenSelect').addEventListener('change',e=>go(e.target.value));
document.getElementById('roleSelect').addEventListener('change',e=>switchRole(e.target.value));
document.addEventListener('submit',onSubmit);
document.addEventListener('click',e=>{
 const el=e.target.closest('button,[data-close-nav]');if(!el){if(e.target.classList.contains('modalshade'))closeModal();return;}
 if(el.hasAttribute('data-close-nav')){document.body.classList.remove('nav-open');return;}
 if(el.dataset.service){const s=services.find(s=>s.id===el.dataset.service);if(s){selectedService=s.id;go(s.page);}return;}
 if(el.dataset.nav){document.body.classList.toggle('nav-open');return;}
 if(el.dataset.go!==undefined){go(Number(el.dataset.go));return;}
 if(el.dataset.passwordToggle){const input=document.getElementById(el.dataset.passwordToggle);if(input){const show=input.type==='password';input.type=show?'text':'password';el.innerHTML=I(show?'eyeoff':'eye');el.setAttribute('aria-label',show?'Ocultar contraseña':'Mostrar contraseña');}return;}
 if(el.dataset.modal){modal(el.dataset.modal);return;}
 if(el.dataset.close){closeModal();return;}
 if(el.dataset.confirm){const selected=activeModal;closeModal();if(selected==='password'){go(26)}else if(selected==='user'){go(21)}else{toast('Cambios confirmados.')}return;}
 if(el.dataset.toast){toast(el.dataset.toast,el.dataset.toast.startsWith('No hemos')?'error':'');return;}
 if(el.dataset.dismiss){el.closest('.toast')?.remove();return;}
 if(el.dataset.toggle!==undefined){el.classList.toggle('off');el.setAttribute('aria-pressed',el.classList.contains('off')?'false':'true');return;}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeModal();document.body.classList.remove('nav-open')}
 if(e.key==='Tab'&&activeModal){const btns=[...document.querySelectorAll('.modal button:not(:disabled),.modal input:not(:disabled)')];if(!btns.length)return;const first=btns[0],last=btns[btns.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
});
const params=new URLSearchParams(location.search);role=params.get('role')==='admin'?'admin':'member';document.getElementById('roleSelect').value=role;const requested=Number(params.get('screen'));go(params.has('screen')&&Number.isInteger(requested)?requested:(role==='admin'?5:6));
</script>
</body>
</html>
