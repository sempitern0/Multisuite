name: Application CI
on:
  push:
    branches: [main]
    paths: &application-paths
      - 'app/**'
      - 'docker/music-proxy/**'
      - '.github/workflows/application.yml'
  pull_request:
    paths: *application-paths
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      storage-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: multisuite_storage_ci
          POSTGRES_USER: storage_ci
          POSTGRES_PASSWORD: disposable-storage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storage_ci -d multisuite_storage_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install locked dependencies
        id: dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Build assets
        run: npm run build
      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/pint --test -v
      - name: Static analysis
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer types:check
      - name: Feature and unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: php artisan test
      - name: PostgreSQL storage concurrency
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          STORAGE_CONCURRENCY_TEST: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: multisuite_storage_ci
          DB_USERNAME: storage_ci
          DB_PASSWORD: disposable-storage-ci
        run: php artisan test tests/Integration/StorageConcurrencyTest.php
      - name: Navidrome account integration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          docker network create navidrome-ci
          trap 'docker rm -f music-gateway-ci navidrome-ci >/dev/null 2>&1; docker network rm navidrome-ci >/dev/null' EXIT
          docker run -d --name navidrome-ci --network navidrome-ci --network-alias navidrome navidrome/navidrome:0.64.2
          docker run -d --name music-gateway-ci --network navidrome-ci -p 127.0.0.1:4533:8080 \
            --user 101:101 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/../docker/music-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/../docker/music-proxy/public:/usr/share/nginx/html:ro" \
            --entrypoint nginx nginx:1.27-alpine -g 'daemon off;'
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4533/ping >/dev/null; then break; fi
            sleep 1
          done
          NAVIDROME_TEST_URL=http://127.0.0.1:4533 php artisan test tests/Integration/NavidromeAccountsTest.php
