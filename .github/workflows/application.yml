name: Application CI
on:
  push:
    branches: [main]
    paths: &application-paths
      - 'app/**'
      - 'docker/music-proxy/**'
      - 'docker/video-proxy/**'
      - 'tests/jellyfin-web-session.mjs'
      - '.github/workflows/application.yml'
  pull_request:
    paths: *application-paths
permissions:
  contents: read
concurrency:
  group: application-${{ github.ref }}
  cancel-in-progress: true
jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      storage-postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: multisuite_storage_ci
          POSTGRES_USER: storage_ci
          POSTGRES_PASSWORD: disposable-storage-ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U storage_ci -d multisuite_storage_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, gd
          tools: composer:v2
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install file tools (photo metadata removal, PDF text for the assistant)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl poppler-utils tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - name: Install locked dependencies
        id: dependencies
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci
      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --ansi
      - name: Build assets
        run: npm run build
      - name: Check formatting
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: vendor/bin/pint --test -v
      - name: Static analysis
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: composer types:check
      - name: Feature and unit tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: php artisan test
      - name: PostgreSQL integration (storage concurrency, query plans)
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        env:
          STORAGE_CONCURRENCY_TEST: '1'
          QUERY_PLAN_TEST: '1'
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_DATABASE: multisuite_storage_ci
          DB_USERNAME: storage_ci
          DB_PASSWORD: disposable-storage-ci
        run: |
          php artisan test tests/Integration/StorageConcurrencyTest.php
          php artisan test tests/Integration/QueryPlanTest.php
          php artisan test tests/Integration/StateChecksTest.php
      - name: Komga account integration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p /tmp/nas-ci-komga/.multisuite-media/reading
          docker network create komga-ci-net
          trap 'docker logs komga-ci; docker logs komga-gateway-ci; docker rm -f komga-gateway-ci komga-ci >/dev/null 2>&1; docker network rm komga-ci-net >/dev/null' EXIT
          docker run -d --name komga-ci --network komga-ci-net --network-alias komga \
            -v /tmp/nas-ci-komga/.multisuite-media/reading:/data:ro \
            -v /tmp/nas-ci-komga/.multisuite-media/reading:/personal:ro gotson/komga:1.30.1
          docker run -d --name komga-gateway-ci --network komga-ci-net -p 127.0.0.1:25600:8080 \
            -v "$PWD/../docker/komga-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/../docker/komga-proxy/public:/usr/share/nginx/html:ro" nginx:1.27-alpine
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:25600/api/v1/claim >/dev/null; then break; fi
            sleep 1
          done
          KOMGA_TEST_URL=http://127.0.0.1:25600 MEDIA_TEST_ROOT=/tmp/nas-ci-komga php artisan test tests/Integration/KomgaAccountsTest.php
      - name: Jellyfin account integration and gateway
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          mkdir -p /tmp/nas-ci-video/.multisuite-media/video /tmp/nas-ci-video/common
          docker network create video-ci-net
          trap 'docker logs --tail=200 jellyfin-ci; docker logs video-gateway-ci 2>/dev/null; docker rm -f video-gateway-ci portal-stub-ci jellyfin-ci >/dev/null 2>&1; docker network rm video-ci-net >/dev/null' EXIT
          docker run -d --name jellyfin-ci --network video-ci-net --network-alias jellyfin --user "$(id -u):$(id -g)" -p 127.0.0.1:8096:8096 \
            -v /tmp/nas-ci-video/.multisuite-media/video:/personal:ro \
            -v /tmp/nas-ci-video/common:/common:ro jellyfin/jellyfin:10.11.11
          for attempt in $(seq 1 120); do
            # 10.11 answers with a temporary setup server while it migrates: wait for the real API.
            if curl -fsS http://127.0.0.1:8096/System/Info/Public 2>/dev/null | grep -q StartupWizardCompleted; then break; fi
            sleep 1
          done
          docker exec jellyfin-ci /usr/lib/jellyfin-ffmpeg/ffmpeg -loglevel error -f lavfi -i color=size=64x64:rate=1 -t 1 -c:v mpeg4 /tmp/fixture.mp4
          docker cp jellyfin-ci:/tmp/fixture.mp4 /tmp/nas-ci-video/fixture.mp4
          JELLYFIN_TEST_URL=http://127.0.0.1:8096 MEDIA_TEST_ROOT=/tmp/nas-ci-video php artisan test tests/Integration/JellyfinAccountsTest.php
          # Gateway: Multisuite look and return link in the web shell only; API and portal route intact.
          docker run -d --name portal-stub-ci --network video-ci-net --network-alias multisuite-portal-web nginx:1.27-alpine
          docker run -d --name video-gateway-ci --network video-ci-net -p 127.0.0.1:8097:8080 \
            -v "$PWD/../docker/video-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$PWD/../docker/video-proxy/public:/usr/share/nginx/html:ro" nginx:1.27-alpine
          for attempt in $(seq 1 30); do curl -fsS http://127.0.0.1:8097/_multisuite/video.css >/dev/null && break; sleep 1; done
          curl -fsSL http://127.0.0.1:8097/web/ | grep -q '/_multisuite/video.mjs'
          curl -fsS http://127.0.0.1:8097/System/Info/Public | grep -q StartupWizardCompleted
          if curl -fsS http://127.0.0.1:8097/System/Info/Public | grep -q '_multisuite'; then echo 'JSON must not be rewritten'; exit 1; fi
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/_multisuite/portal)" = 404  # answered by the portal stub
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8097/_multisuite/other)" = 404
          mkdir -p /tmp/video-screens
          # The session the portal hands over signs Jellyfin's real web interface in (enter.js).
          login=$(curl -fsS http://127.0.0.1:8097/Users/AuthenticateByName -H 'Content-Type: application/json' \
            -H 'Authorization: MediaBrowser Client="CI", Device="CI", DeviceId="ci-web", Version="1"' \
            -d '{"Username":"bruno","Pw":"bruno-password-123"}')
          server=$(curl -fsS http://127.0.0.1:8097/System/Info/Public | jq -r .Id)
          node ../tests/jellyfin-web-session.mjs http://127.0.0.1:8097 "$server" "$(echo "$login" | jq -r .User.Id)" "$(echo "$login" | jq -r .AccessToken)" /tmp/video-screens
          for size in 1280,800 390,844; do
            google-chrome --headless=new --no-sandbox --disable-gpu --hide-scrollbars --virtual-time-budget=15000 \
              --window-size="$size" --screenshot="/tmp/video-screens/login-${size%,*}.png" http://127.0.0.1:8097/web/ || true
          done
      - name: Jellyfin screenshots
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: jellyfin-screens
          path: /tmp/video-screens
          if-no-files-found: ignore
      - name: Navidrome account integration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          docker network create navidrome-ci
          # Connected folders: the portal mirrors into this tree, Navidrome reads it as /personal.
          mkdir -p /tmp/nas-ci-music/.multisuite-media/music
          trap 'docker rm -f music-gateway-ci navidrome-ci >/dev/null 2>&1; docker network rm navidrome-ci >/dev/null' EXIT
          docker run -d --name navidrome-ci --network navidrome-ci --network-alias navidrome \
            -v /tmp/nas-ci-music/.multisuite-media/music:/personal:ro navidrome/navidrome:0.64.2
          docker run -d --name music-gateway-ci --network navidrome-ci -p 127.0.0.1:4533:8080 \
            --user 101:101 --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges:true \
            -v "$PWD/../docker/music-proxy/nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/../docker/music-proxy/public:/usr/share/nginx/html:ro" \
            --entrypoint nginx nginx:1.27-alpine -g 'daemon off;'
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4533/ping >/dev/null; then break; fi
            sleep 1
          done
          NAVIDROME_TEST_URL=http://127.0.0.1:4533 MEDIA_TEST_ROOT=/tmp/nas-ci-music php artisan test tests/Integration/NavidromeAccountsTest.php
      - name: Kavita account integration
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          trap 'docker rm -f kavita-ci >/dev/null 2>&1; docker volume rm kavita-ci-config >/dev/null 2>&1' EXIT
          mkdir -p /tmp/kavita-ci/books /tmp/kavita-ci/comics /tmp/kavita-ci/manga /tmp/kavita-ci/docs /tmp/nas-ci-reading/.multisuite-media/reading
          # Same hardening as compose.reading.yaml.
          docker run -d --name kavita-ci -p 127.0.0.1:5000:5000 --cap-drop ALL --cap-add CHOWN --cap-add DAC_OVERRIDE --cap-add FOWNER --security-opt no-new-privileges:true \
            -v kavita-ci-config:/kavita/config \
            -v /tmp/kavita-ci/books:/books:ro -v /tmp/kavita-ci/comics:/comics:ro \
            -v /tmp/kavita-ci/manga:/manga:ro -v /tmp/kavita-ci/docs:/docs:ro \
            -v /tmp/nas-ci-reading/.multisuite-media/reading:/personal:ro \
            jvmilazz0/kavita:0.9.1
          for attempt in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:5000/api/health >/dev/null; then break; fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:5000/api/health >/dev/null || { docker logs --tail 80 kavita-ci; exit 1; }
          KAVITA_TEST_URL=http://127.0.0.1:5000 MEDIA_TEST_ROOT=/tmp/nas-ci-reading php artisan test tests/Integration/KavitaAccountsTest.php || { docker logs --tail 80 kavita-ci; exit 1; }
