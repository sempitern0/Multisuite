# Administrator-only local reading pilot, independent of Kavita's database.
name: multisuite-komga
services:
  komga:
    image: gotson/komga:1.30.1
    restart: unless-stopped
    environment:
      TZ: Europe/Madrid
      SERVER_SERVLET_SESSION_TIMEOUT: "${SESSION_LIFETIME:-120}m"
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - komga-config:/config
      - type: volume
        source: nas
        target: /data
        read_only: true
        volume:
          subpath: .multisuite-media/reading
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:25600/"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  komga-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KOMGA_PORT:-25600}:8080"
    depends_on:
      komga:
        condition: service_healthy
    networks: [default, accounts]
    volumes:
      - ./docker/komga-proxy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/komga-proxy/public:/usr/share/nginx/html:ro
      - type: volume
        source: nas
        target: /srv/media
        read_only: true
        volume:
          subpath: .multisuite-media/reading
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12
networks:
  accounts:
    external: true
    name: multisuite-accounts
volumes:
  komga-config: {}
  nas:
    external: true
    name: multisuite-nas-dev
