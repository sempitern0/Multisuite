# Administrator-only local reading pilot, independent of Kavita's database.
name: multisuite-komga
services:
  komga:
    image: gotson/komga:1.30.1
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KOMGA_PORT:-25600}:25600"
    environment:
      TZ: Europe/Madrid
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    volumes:
      - komga-config:/config
      - type: volume
        source: nas
        target: /data
        read_only: true
        volume:
          subpath: .multisuite-media/reading
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:25600/"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  komga-config: {}
  nas:
    external: true
    name: multisuite-nas-dev
